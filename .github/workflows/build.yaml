name: Compile Slideshow App

on:
  push:
    branches: [ main ] # Triggers whenever you push code to the main branch
  workflow_dispatch: # Allows you to manually click a button to build

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: Slideshow_Creator.exe
            asset_path: dist/Slideshow_Creator.exe
          - os: macos-latest
            artifact_name: Slideshow_Creator.app
            asset_path: dist/Slideshow_Creator.app

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller moviepy pillow numpy proglog

    - name: Run PyInstaller Build
      run: |
        pyinstaller --noconsole --onefile --name="Slideshow_Creator" --hidden-import="moviepy.video.fx" --hidden-import="proglog" --collect-all "moviepy" --clean main.py

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: Slideshow-Creator-${{ matrix.os }}
        path: ${{ matrix.asset_path }}
