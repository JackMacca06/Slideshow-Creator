name: Compile Slideshow App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: Slideshow_Creator_Windows
            asset_path: dist/Slideshow_Creator.exe
          - os: macos-latest
            artifact_name: Slideshow_Creator_Mac
            asset_path: dist/Slideshow_Creator.app

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies (Windows Only)
      if: matrix.os == 'windows-latest'
      run: |
        # Force windows runner to properly pull down clean tcl/tk binaries for tkinter stability
        python -m pip install --upgrade pip
        pip install imageio-ffmpeg

    - name: Install Common Dependencies
      run: |
        pip install pyinstaller moviepy pillow numpy proglog

    - name: Run PyInstaller Build
      run: |
        pyinstaller --noconsole --onefile --name="Slideshow_Creator" --hidden-import="moviepy.video.fx" --hidden-import="proglog" --collect-all "moviepy" --clean main.py

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_path }}

